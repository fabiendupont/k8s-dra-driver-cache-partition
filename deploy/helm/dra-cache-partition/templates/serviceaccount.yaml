{{- if .Values.driver.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dra-cache-partition.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dra-cache-partition.labels" . | nindent 4 }}
  {{- with .Values.driver.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
