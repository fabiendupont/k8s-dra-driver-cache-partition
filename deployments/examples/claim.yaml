apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: my-cache-partition
spec:
  devices:
    requests:
      - name: cache
        exactly:
          deviceClassName: cache-partition-slices
          selectors:
            - cel:
                expression: "device.attributes['cache-partition.fabiendupont.io'].cacheLevel == 'L3'"
