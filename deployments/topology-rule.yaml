apiVersion: v1
kind: ConfigMap
metadata:
  name: cache-partition-numa-rule
  namespace: dra-cache-partition
  labels:
    nodepartition.dra.k8s.io/topology-rule: "true"
data:
  attribute: cache-partition.fabiendupont.io/numaNode
  type: int
  driver: cache-partition.fabiendupont.io
  mapsTo: numaNode
  partitioning: group
  constraint: match
  enforcement: preferred
  description: >-
    Maps the cache partition driver's numaNode attribute to the topology
    coordinator's standard NUMA model, enabling NUMA-aligned co-scheduling
    of cache partitions with CPU time slots, GPUs, and NICs.
